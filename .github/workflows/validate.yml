# PR build validation

name: Validate

on:
  pull_request:
    paths:
      - 'plugins/**'
      - '.github/**'
      - 'repo.config.json'
      - 'wrangler.json'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - '*.gradle.kts'
      - 'gradle/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.base.json'
      - 'biome.json'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Lint the workflow scripts
        run: shellcheck .github/scripts/*.sh

      - run: bun install --frozen-lockfile

      - name: Lint plugin source and configuration
        run: bun run lint

      - name: Check plugin types
        run: bun run lint:types

      - name: Build all plugins
        run: ./gradlew --no-daemon packageAllPlugins

      - name: Generate index from built artifacts
        run: |
          bun run generate-index \
            --dist build/dist \
            --base-url https://valenced.local \
            --out /tmp/index.json
          cat /tmp/index.json
